{% extends 'portal/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-5 text-center">
                    <h2 class="fw-bold mb-4">Complete Your Payment</h2>
                    
                    <div class="alert alert-info">
                        <h4 class="alert-heading">Booking ID: #{{ booking.id }}</h4>
                        <p class="mb-0">Total Amount Payable: <strong>₹{{ amount_display }}</strong></p>
                    </div>
                    
                    <p class="text-muted mb-4">Please complete your payment to confirm the booking. You will also receive a WhatsApp confirmation.</p>

                    <button id="rzp-button1" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm">
                        <i class="fas fa-lock me-2"></i> Pay ₹{{ amount_display }} Securely
                    </button>
                    
                    <!-- Hidden form to submit to our django view after payment -->
                    <form name="razorpay_form" action="{% url 'payment_verify' %}" method="POST" class="d-none">
                        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
                        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id" value="{{ razorpay_order_id }}">
                        <input type="hidden" name="razorpay_signature" id="razorpay_signature">
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{ razorpay_key_id }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "AutoFix Services",
        "description": "Service Booking Payment",
        "image": "https://example.com/your_logo",
        "order_id": "{{ razorpay_order_id }}",
        "handler": function (response){
            document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
            document.getElementById('razorpay_signature').value = response.razorpay_signature;
            // Submit the hidden form
            document.razorpay_form.submit();
        },
        "prefill": {
            "name": "{{ booking.customer_name }}",
            "email": "{{ booking.customer_email }}",
            "contact": "{{ booking.customer_phone }}"
        },
        "theme": {
            "color": "#0d6efd"
        }
    };
    var rzp1 = new Razorpay(options);
    
    // Handle payment failure event
    rzp1.on('payment.failed', function (response){
        alert("Payment Failed! Reason: " + response.error.description);
    });

    document.getElementById('rzp-button1').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }
</script>
{% endblock %}
